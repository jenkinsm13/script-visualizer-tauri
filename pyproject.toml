[project]
name = "script-visualizer-tauri"
version = "0.1.0"
description = "Screenplay parser → AI-generated storyboard images. Tauri+Svelte UI on a FastAPI Python sidecar."
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # Image generation clients (kept loose; pin once we know which backend wins)
    "pillow>=10.0",
    "pymupdf>=1.26",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "server*"]
